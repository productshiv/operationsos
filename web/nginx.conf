server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — everything falls back to index.html
  location / {
    try_files $uri /index.html;
  }

  # Bare /tf -> /tf/ so the harness admin UI loads instead of the SPA fallback.
  location = /tf {
    return 301 /tf/;
  }

  # Reverse-proxy the TrueForge harness under /tf so the browser only ever
  # talks to this origin (no CORS).
  #
  # The harness hostname is resolved PER REQUEST via Docker's embedded DNS
  # (127.0.0.11), not once at worker startup. A literal hostname in proxy_pass is
  # resolved a single time and cached forever, so if the harness container restarts
  # and gets a new IP (a Coolify redeploy, a crash-loop that settles) nginx keeps
  # forwarding to the dead address and every /tf call 502s until nginx is restarted.
  # Putting the upstream in a variable forces runtime resolution; the `rewrite`
  # strips the /tf prefix that the variable form of proxy_pass would otherwise keep:
  #   /tf/api/v1/... -> /api/v1/...
  # The business's own feed service. The floor polls /feed/stats to learn what is waiting for a
  # human (open complaints, live error bursts) — it has no database access of its own. Same
  # per-request DNS trick as /tf so a redeployed feed container is picked up without an nginx reload.
  # Optional: if no `feed` service is running, /feed just 502s and the desks show no inbound badge.
  location /feed/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $feed_upstream feed;
    rewrite ^/feed/(.*)$ /$1 break;
    proxy_pass http://$feed_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  location /tf/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $harness_upstream harness;
    rewrite ^/tf/(.*)$ /$1 break;
    proxy_pass http://$harness_upstream:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Turn/event streams are Server-Sent Events — don't buffer, and allow long turns.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
