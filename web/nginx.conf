server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — everything falls back to index.html
  location / {
    try_files $uri /index.html;
  }

  # Bare /tf -> /tf/ so the harness admin UI loads instead of the SPA fallback.
  location = /tf {
    return 301 /tf/;
  }

  # Reverse-proxy the TrueForge harness under /tf so the browser only ever
  # talks to this origin (no CORS). The trailing slash on proxy_pass strips
  # the /tf prefix: /tf/v1/... -> http://harness:8790/v1/...
  location /tf/ {
    proxy_pass http://harness:8790/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Turn/event streams are Server-Sent Events — don't buffer, and allow long turns.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
